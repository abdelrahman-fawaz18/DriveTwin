# Qualification fixture, not a production deployment.
x-app: &app
  image: ${APP_IMAGE:?Use scripts/platform/dataflow.py}
  environment:
    EVDT_RUN_ID: ${EVDT_RUN_ID:?}
    DB_PASSWORD_FILE: /run/secrets/db_password
  secrets: [db_password]
  read_only: true
  tmpfs: [/tmp:size=16m]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 192m
  pids_limit: 64
  networks: [fixture]

services:
  db:
    image: ${POSTGRES_IMAGE:?}
    environment:
      POSTGRES_USER: evdt
      POSTGRES_DB: evdt
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=20]
    volumes: [database:/var/lib/postgresql]
    mem_limit: 256m
    pids_limit: 96
    networks: [fixture]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U evdt -d evdt"]
      interval: 2s
      timeout: 2s
      retries: 30
  broker:
    image: ${MOSQUITTO_IMAGE:?}
    user: "1883:1883"
    volumes:
      - ./containers/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - broker:/mosquitto/data
    mem_limit: 64m
    pids_limit: 32
    networks: [fixture]
    healthcheck:
      test: [CMD, mosquitto_pub, -h, localhost, -t, qualification/health, -m, ready]
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    <<: *app
    command: [python, -m, evdt.repository]
    depends_on:
      db: {condition: service_healthy}
  ingest:
    <<: *app
    command: [python, -m, evdt.ingest]
    depends_on:
      migrate: {condition: service_completed_successfully}
      broker: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1:${API_PORT:-18760}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  probe:
    <<: *app
    profiles: [tools]
    command: [python, -m, evdt.probe]

networks:
  fixture:
    internal: true
volumes:
  database:
    labels: {com.evdt.scope: p0-dataflow}
  broker:
    labels: {com.evdt.scope: p0-dataflow}
secrets:
  db_password:
    file: ${PASSWORD_PATH:?}
