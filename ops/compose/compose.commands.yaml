# Explicit opt-in command services for one local simulation target.
x-command-app: &app
  image: ${COMMAND_IMAGE:-evdt-energy-collector:p2}
  pull_policy: never
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 192m
  pids_limit: 48
  tmpfs: ["/tmp:size=32m,mode=1777"]
  networks: [fixture]
  working_dir: /workspace

x-target: &target
  PYTHONPATH: /workspace/src
  EVDT_RUN_ID: ${EVDT_RUN_ID:?}
  COMMAND_ASSET_ID: ${COMMAND_ASSET_ID:?}
  COMMAND_ISSUER: ${COMMAND_ISSUER:?}

services:
  command-migrate:
    <<: *app
    environment:
      <<: *target
      DB_USER: evdt_admin
      DB_PASSWORD_FILE: /run/secrets/admin_db
      COMMAND_DB_PASSWORD_FILE: /run/secrets/command_db
      COMMAND_STATIONS_FILE: /workspace/scenario/stations.json
    secrets: [admin_db, command_db]
    volumes:
      - ./src:/workspace/src:ro
      - ./contracts:/workspace/contracts:ro
      - ./migrations/commands:/workspace/migrations/commands:ro
      - ./simulation/montreal/stations.json:/workspace/scenario/stations.json:ro
    command: [python, -m, evdt.command_journal]
    depends_on:
      migrate: {condition: service_completed_successfully}
  command-api:
    <<: *app
    environment:
      <<: *target
      DB_USER: evdt_command
      DB_PASSWORD_FILE: /run/secrets/command_db
    secrets: [command_db, command_operator, command_executor, command_observer]
    volumes:
      - ./src:/workspace/src:ro
      - ./contracts:/workspace/contracts:ro
    networks: [fixture, host-access]
    ports: ["127.0.0.1:${COMMAND_PORT:-18831}:8000"]
    command: [uvicorn, evdt.command_api:app, --host, 0.0.0.0, --port, "8000", --limit-concurrency, "16"]
    depends_on:
      command-migrate: {condition: service_completed_successfully}
  command-simulator:
    <<: *app
    profiles: [command-drive]
    environment: *target
    mem_limit: 512m
    cpus: 1
    secrets: [command_executor]
    volumes:
      - ./src:/workspace/src:ro
      - ./contracts:/workspace/contracts:ro
      - ./catalog:/workspace/catalog:ro
      - ./scripts/commands:/workspace/scripts/commands:ro
      - ./simulation/montreal:/workspace/simulation/montreal:ro
      - ./data/public/montreal-core-v1:/workspace/data/public/montreal-core-v1:ro
      - ${COMMAND_EVIDENCE_DIR:?}:/evidence
    command: [python, scripts/commands/run_connected_speed_limit.py]
    depends_on:
      command-api: {condition: service_started}
  command-observer:
    <<: *app
    profiles: [command-observe]
    environment: *target
    secrets: [command_observer]
    volumes:
      - ./src:/workspace/src:ro
      - ./contracts:/workspace/contracts:ro
      - ./scripts/commands:/workspace/scripts/commands:ro
      - ${COMMAND_EVIDENCE_DIR:?}:/evidence:ro
    entrypoint: [python, scripts/commands/report_speed_evidence.py]
    depends_on:
      command-api: {condition: service_started}

secrets:
  command_db: {file: "${SECRET_DIRECTORY:?}/command_db"}
  command_operator: {file: "${SECRET_DIRECTORY:?}/command_operator"}
  command_executor: {file: "${SECRET_DIRECTORY:?}/command_executor"}
  command_observer: {file: "${SECRET_DIRECTORY:?}/command_observer"}
