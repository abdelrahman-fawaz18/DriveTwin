services:
  api:
    environment:
      SENDER_SERVICES: '{"bus-001":"sender","bus-002":"sender2"}'
  source:
    command: [python, -m, evdt.monitoring.adapter, --maximum-samples, "30"]
  sender2:
    extends:
      file: ops/compose/compose.monitoring.yaml
      service: sender
    environment:
      ASSET_ID: bus-002
      CATALOG_VERSION: 1.3.0
      MQTT_USER: adapter-bus-002
      MQTT_PASSWORD_FILE: /run/secrets/adapter2_mqtt
    secrets: !override [adapter2_mqtt, metrics]
    volumes: !override [spool2:/spool]
  source2:
    extends:
      file: ops/compose/compose.monitoring.yaml
      service: source
    environment:
      ASSET_ID: bus-002
      CATALOG_VERSION: 1.3.0
      PRODUCER_TOKEN_FILE: /run/secrets/producer2
    command: [python, -m, evdt.monitoring.adapter, --maximum-samples, "30"]
    secrets: !override [producer2]
    volumes: !override
      - spool2:/spool
      - source-output2:/source-output
      - ./simulation/montreal-bus-002:/scenario:ro
      - ./data/public/montreal-core-v1/roads.osm.xml:/input/roads.osm.xml:ro
  probe:
    secrets:
      - map_context2
    volumes:
      - source-output2:/source-output-2
volumes:
  spool2: {labels: {com.evdt.scope: p1-extension}}
  source-output2: {labels: {com.evdt.scope: p1-extension}}

secrets:
  map_context2: {file: "${SECRET_DIRECTORY:?}/map_context2.json"}
