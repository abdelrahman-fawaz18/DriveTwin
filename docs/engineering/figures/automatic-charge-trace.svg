<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 431" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif">
<title id="title">Measured battery energy during the automatic diversion</title><desc id="desc">The bus starts at 54 kilowatt-hours, reaches the charger with about 52.35, charges to 87.5, then resumes and finishes. The 35 kilowatt-hour reserve is never crossed.</desc>
